name: Market data snapshot

# Pulls index F&O snapshots from Upstox during market hours and publishes them
# to the `market-data` branch (one commit, force-updated, so history stays small).

on:
  schedule:
    # Every 15 min, Mon–Fri, 03:00–10:45 UTC (= 08:30–16:15 IST).
    # The job itself skips runs outside 09:00–15:45 IST.
    - cron: "*/15 3-10 * * 1-5"
  workflow_dispatch:
    inputs:
      debug:
        description: "Also publish raw API responses"
        type: boolean
        default: false
      force:
        description: "Run even outside market hours"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: market-data
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check market window (IST)
        id: window
        run: |
          now=$(TZ=Asia/Kolkata date +%H%M)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" = "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "$now" -ge 0900 ] && [ "$now" -le 1545 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Outside market window ($now IST), skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.window.outputs.run == 'true'

      - uses: actions/setup-python@v6
        if: steps.window.outputs.run == 'true'
        with:
          python-version: "3.12"

      - name: Fetch snapshots from Upstox
        id: fetch
        if: steps.window.outputs.run == 'true'
        env:
          UPSTOX_ANALYTICS_TOKEN: ${{ secrets.UPSTOX_ANALYTICS_TOKEN }}
        run: |
          mkdir -p out/latest
          RAW=""
          if [ "${{ inputs.debug }}" = "true" ]; then RAW="--raw out/raw"; fi
          if [ -z "$UPSTOX_ANALYTICS_TOKEN" ]; then
            echo "Secret UPSTOX_ANALYTICS_TOKEN is empty or missing" | tee out/latest/_run.log
            echo "ok=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          set +e
          python3 data_fetcher/upstox_fetch.py --out out/latest $RAW 2>&1 | tee out/latest/_run.log
          code=${PIPESTATUS[0]}
          echo "exit code: $code" >> out/latest/_run.log
          if [ "$code" = "0" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "ok=false" >> "$GITHUB_OUTPUT"; fi

      - name: Publish to market-data branch
        if: steps.window.outputs.run == 'true'
        run: |
          cd out
          git init -q -b market-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf '# Market data snapshots\n\nAuto-generated by the Market data snapshot workflow. Latest snapshot only.\n' > README.md
          git add -A
          git commit -q -m "Market snapshot $(TZ=Asia/Kolkata date '+%Y-%m-%d %H:%M IST')"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" market-data

      - name: Fail if fetch failed
        if: steps.window.outputs.run == 'true' && steps.fetch.outputs.ok != 'true'
        run: |
          echo "Fetch failed — see out/latest/_run.log on the market-data branch"
          exit 1
